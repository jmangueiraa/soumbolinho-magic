<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradiente do anel externo: Azul para Verde -->
    <linearGradient id="ajpFaviconRing" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0062FF" />
      <stop offset="50%" stop-color="#00A3FF" />
      <stop offset="100%" stop-color="#00C853" />
    </linearGradient>

    <!-- Gradiente da Sacola Azul -->
    <linearGradient id="ajpFaviconBag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0072FF" />
      <stop offset="100%" stop-color="#0052D4" />
    </linearGradient>
  </defs>

  <!-- Fundo Circular Branco -->
  <circle cx="250" cy="250" r="240" fill="#FFFFFF" />

  <!-- Anel Circular Externo Degradê -->
  <circle cx="250" cy="250" r="224" fill="none" stroke="url(#ajpFaviconRing)" stroke-width="24" stroke-linecap="round" />

  <!-- ÍCONE CENTRAL (Sacola + Foguete + Seta) -->
  <g id="ajp-icon-group" transform="translate(0, 0)">
    <!-- Alça da Sacola de Compras -->
    <path d="M195 130 C195 85, 305 85, 305 130" fill="none" stroke="url(#ajpFaviconBag)" stroke-width="24" stroke-linecap="round" />

    <!-- Corpo da Sacola de Compras -->
    <path d="M182 130 L145 305 C142 318 152 328 165 328 L335 328 C348 328 358 318 355 305 L318 130 C315 122 308 118 298 118 L202 118 C192 118 185 122 182 130 Z" fill="url(#ajpFaviconBag)" />

    <!-- Rastro de Fogo do Foguete (Barras Verdes Verticais) -->
    <rect x="220" y="270" width="14" height="40" rx="7" fill="#00C853" />
    <rect x="243" y="260" width="14" height="60" rx="7" fill="#00C853" />
    <rect x="266" y="270" width="14" height="40" rx="7" fill="#00C853" />

    <!-- Foguete em Decolagem (Branco) -->
    <path d="M250 145 C260 175 272 215 272 258 L228 258 C228 215 240 175 250 145 Z" fill="#FFFFFF" />
    <path d="M228 215 L204 258 L228 250 Z" fill="#FFFFFF" />
    <path d="M272 215 L296 258 L272 250 Z" fill="#FFFFFF" />
    <circle cx="250" cy="182" r="11" fill="#0062FF" />

    <!-- Seta Curva Verde em Órbita -->
    <path d="M115 255 C110 300 165 315 235 285 C295 258 360 195 385 140" fill="none" stroke="#00C853" stroke-width="22" stroke-linecap="round" />
    <path d="M362 138 L398 130 L390 168 L376 150 Z" fill="#00C853" />
  </g>
</svg>
