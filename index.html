    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Título Principal da Loja -->

    <!-- Open Graph / Redes Sociais & WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AJPSTORE — Crie sua loja online em minutos" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="Crie sua loja online com a AJPSTORE. Tenha landing pages, checkout Mercado Pago, Upsell, domínio próprio e muito mais. Teste grátis por 7 dias." />
    <meta name="twitter:image" content="/ajpstore-logo.png" />
    
    <!-- Google Fonts: Plus Jakarta Sans & Fredoka -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Global theme fallback to permanently prevent applyThemeToDocument is not defined -->
    <script>
      window.applyThemeToDocument = function(colorPaletteId, customPrimaryColor, themeLayout) {
        try {
          var primary = (customPrimaryColor && String(customPrimaryColor).trim().length > 0) ? customPrimaryColor : '#FF1493';
          var root = document.documentElement;
          if (root && root.style) {
            root.style.setProperty('--primary-color', primary);
            root.style.setProperty('--color-primary', primary);
            if (colorPaletteId) root.setAttribute('data-theme', colorPaletteId);
            if (themeLayout) root.setAttribute('data-layout', themeLayout);
          }
          if (document.body && document.body.style) {
            document.body.style.setProperty('--primary-color', primary);
            document.body.style.setProperty('--color-primary', primary);
            if (colorPaletteId) document.body.setAttribute('data-theme', colorPaletteId);
            if (themeLayout) document.body.setAttribute('data-layout', themeLayout);
          }
        } catch (e) {}
      };
    </script>
  </head>
  <body class="bg-white text-slate-900 font-sans antialiased min-h-screen selection:bg-slate-900 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
